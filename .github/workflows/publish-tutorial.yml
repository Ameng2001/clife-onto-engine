name: publish-tutorial

# 把 docs/tutorial/FDE课程 发布到 Ameng2001/fde-workshop（GitHub Pages 站点）。
# 本仓库是教材的唯一真相源；fde-workshop 是只读的发布副本，每次同步整体覆盖。
#
# 需要一个仓库 secret：FDE_WORKSHOP_TOKEN
#   —— 一个对 Ameng2001/fde-workshop 有 Contents: write 权限的 PAT
#   （Fine-grained token 选该仓库 + Repository permissions → Contents: Read and write）

# 触发：改了教材（合并进 main）就自动发布；也可在 Actions 里手动跑。
#
# 若 token 过期导致本 workflow 持续失败，可临时注释掉 push: 一段改回手动触发，
# 换好 secret 后再放开。
on:
  push:
    branches: [main]
    paths:
      - 'docs/tutorial/**'
      - '.github/workflows/publish-tutorial.yml'
  workflow_dispatch:

concurrency:
  group: publish-tutorial
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出教材源
        uses: actions/checkout@v4

      - name: 检出发布仓库
        uses: actions/checkout@v4
        with:
          repository: Ameng2001/fde-workshop
          token: ${{ secrets.FDE_WORKSHOP_TOKEN }}
          path: .publish

      - name: 同步内容（整体覆盖，保留站点专属文件）
        run: |
          set -euo pipefail
          SRC="docs/tutorial/FDE课程"
          DST=".publish"

          # 站点专属、不来自上游的三个文件：同步时保留
          #   /index.html  站点落地页（上游没有这个文件）
          #   /README.md   发布仓库说明
          #   /.nojekyll   否则 Jekyll 会忽略 _legacy/ 等下划线开头的目录
          #
          # ⚠️ 前导斜杠不能省：rsync 的 exclude 模式不带 '/' 会匹配**任意层级**的同名文件。
          #    写成 'index.html' 会连 slides/index.html（课程总览）一起排除掉，
          #    导致新增课程在站点首页上没有入口。
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/index.html' \
            --exclude='/README.md' \
            --exclude='/.nojekyll' \
            "$SRC"/ "$DST"/

          # .nojekyll 兜底：万一发布仓库里被删了，补回来
          touch "$DST/.nojekyll"

          find "$DST" -name '.DS_Store' -delete || true

      - name: 提交并推送
        working-directory: .publish
        env:
          # 经环境变量传入，不要直接插进 shell 字符串——提交信息可能含引号/反引号；
          # workflow_dispatch 触发时 head_commit 为空，下面用 :- 兜底。
          UPSTREAM_SHA: ${{ github.sha }}
          UPSTREAM_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "教材无变化，跳过。"
            exit 0
          fi
          git commit \
            -m "sync: 来自 clife-onto-engine@${UPSTREAM_SHA:0:7}" \
            -m "上游提交：${UPSTREAM_MSG:-（手动触发）}" \
            -m "由 .github/workflows/publish-tutorial.yml 自动同步。请勿直接在本仓库提交——下次同步会被覆盖。"
          git push
          echo "已发布 → https://ameng2001.github.io/fde-workshop/"
