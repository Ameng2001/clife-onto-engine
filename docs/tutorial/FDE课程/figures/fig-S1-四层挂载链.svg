<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
</style>
<defs>
<marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
<filter id="sh" x="-3%" y="-6%" width="106%" height="116%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.07"/></filter>
</defs>
<rect width="1400" height="810" fill="#ffffff"/>
<text x="60" y="44" font-size="21" font-weight="700" fill="#111827">四层架构：本体在哪一层</text>
<text x="60" y="68" font-size="13" fill="#6b7280">中间那层是<tspan font-weight="700" fill="#111827">两条并行的线</tspan>——数据集与知识库形态不同、挂法不同、能不能驱动写入也不同</text>
<rect x="60" y="92" width="940" height="82" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="82" y="122" font-size="15" font-weight="700" fill="#111827">④ 业务消费层</text>
<text x="82" y="150" font-size="13.5" fill="#374151">AI Agent　·　业务应用　·　决策看板</text>
<text x="978" y="122" font-size="12" fill="#6b7280" text-anchor="end">只通过本体接口交互</text>
<text x="978" y="150" font-size="12" font-weight="700" fill="#374151" text-anchor="end">不直接访问底层数据库</text>
<rect x="60" y="238" width="940" height="112" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8" filter="url(#sh)"/>
<text x="82" y="268" font-size="15" font-weight="700" fill="#111827">③ 业务本体平台</text>
<text x="230" y="268" font-size="12.5" font-weight="700" fill="#2563eb">★ 数据层和应用层之间的语义枢纽</text>
<text x="978" y="268" font-size="12" font-weight="700" fill="#2563eb" text-anchor="end">不重新存储数据</text>
<rect x="82" y="286" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="158" y="308" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Object</text>
<rect x="246" y="286" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="322" y="308" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Link</text>
<rect x="410" y="286" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="486" y="308" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Function</text>
<rect x="574" y="286" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="650" y="308" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Rule</text>
<rect x="738" y="286" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="814" y="308" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Action</text>
<text x="82" y="340" font-size="12" fill="#6b7280">在数据之上建立语义模型，向下认领 ②a / ②b，向上为 ④ 提供受约束的操作接口</text>
<rect x="60" y="418" width="440" height="146" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
<text x="82" y="448" font-size="14.5" font-weight="700" fill="#111827">②a 数据集层</text>
<text x="478" y="448" font-size="12" fill="#15803d" text-anchor="end">数据仓库 / 数据湖</text>
<text x="82" y="474" font-size="13" fill="#374151">ODS → DWD → DWS</text>
<text x="82" y="497" font-size="12.5" fill="#6b7280">结构化事实数据，但没有业务语义</text>
<rect x="82" y="514" width="116" height="28" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="140" y="533" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">必有主键</text>
<rect x="210" y="514" width="74" height="28" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="247" y="533" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">进图</text>
<rect x="296" y="514" width="116" height="28" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="354" y="533" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">能驱动写入</text>
<rect x="560" y="418" width="440" height="146" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#sh)"/>
<text x="582" y="448" font-size="14.5" font-weight="700" fill="#111827">②b 知识库层</text>
<text x="978" y="448" font-size="12" fill="#b45309" text-anchor="end">标准 · 规程 · 案例 · 手册</text>
<text x="582" y="474" font-size="13" fill="#374151">全文语料</text>
<text x="582" y="497" font-size="12.5" fill="#6b7280">非结构化，靠出处建立可信</text>
<rect x="582" y="514" width="116" height="28" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
<text x="640" y="533" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">必带出处</text>
<rect x="710" y="514" width="90" height="28" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
<text x="755" y="533" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">不进图</text>
<rect x="816" y="514" width="60" height="28" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
<text x="846" y="533" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">只读</text>
<rect x="886" y="514" width="98" height="28" rx="14" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="935" y="533" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">不能写入</text>
<rect x="60" y="632" width="940" height="86" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="82" y="662" font-size="14.5" font-weight="700" fill="#111827">① 源系统</text>
<text x="978" y="662" font-size="12" fill="#6b7280" text-anchor="end">割裂的、异构的</text>
<line x1="530" y1="672" x2="530" y2="706" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="82" y="698" font-size="13" fill="#374151">ERP　·　CRM　·　生产控制　·　IoT</text>
<text x="556" y="698" font-size="13" fill="#374151">文档库　·　知识管理系统　·　制度汇编</text>
<line x1="280" y1="630" x2="280" y2="570" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="780" y1="630" x2="780" y2="570" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="280" y1="416" x2="280" y2="356" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="196" y="374" width="168" height="24" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="280" y="391" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">认领结构化数据</text>
<line x1="780" y1="416" x2="780" y2="356" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="646" y="374" width="268" height="24" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="780" y="391" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">知识通道 ①②③ 挂进本体（受治理）</text>
<line x1="530" y1="236" x2="530" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<rect x="422" y="194" width="216" height="24" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="530" y="211" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">受约束的操作接口</text>
<path d="M1000,462 L1036,462 L1036,133 L1002,133" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#ar)"/>
<rect x="1068" y="300" width="306" height="188" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="1088" y="330" font-size="14" font-weight="700" fill="#b91c1c">④ 号知识通道 · 旁路</text>
<line x1="1088" y1="342" x2="1354" y2="342" stroke="#fecaca" stroke-width="1.2"/>
<text x="1088" y="366" font-size="12.5" fill="#7f1d1d">绕过 ③ 本体，直供 ④ 的</text>
<text x="1088" y="386" font-size="12.5" font-weight="700" fill="#7f1d1d">advise（开放问答）</text>
<text x="1088" y="414" font-size="12.5" fill="#7f1d1d">不受治理 · 只读 · 每段带出处</text>
<text x="1088" y="442" font-size="12.5" fill="#7f1d1d">它之所以允许存在，正是因为</text>
<text x="1088" y="462" font-size="12.5" font-weight="700" fill="#b91c1c">它出不了 Action 引擎那道门</text>
<rect x="60" y="742" width="940" height="44" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<line x1="82" y1="764" x2="118" y2="764" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
<text x="128" y="769" font-size="12" fill="#374151">认领 / 挂载（本体点名要数据）</text>
<line x1="380" y1="764" x2="416" y2="764" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<text x="426" y="769" font-size="12" fill="#374151">受约束的操作接口</text>
<line x1="620" y1="764" x2="656" y2="764" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#ar)"/>
<text x="666" y="769" font-size="12" fill="#374151">④ 号通道旁路（不受治理，只读）</text>
<text x="1068" y="769" font-size="14" font-weight="700" fill="#b91c1c">检索的结果绝不驱动写入。</text>
</svg>